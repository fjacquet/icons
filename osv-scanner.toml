[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-27
reason = "brace-expansion@2.1.2 DoS via unbounded expansion, reached only through eslint-plugin-react@7.37.5 > minimatch@3.1.5 — lint-time devDependency, never shipped. The 2.x line has no fixed release; 5.0.8 changed the CJS entry point from a default callable to a named { expand } export, which minimatch@3 cannot consume. Dropping the `brace-expansion` override instead resolves that path down to 1.1.16, which regresses `npm run lint` into an out-of-memory crash, so the override is deliberately kept at ^2.1.2 (this also clears GHSA-3jxr-9vmj-r5cp). Re-check when eslint-plugin-react drops its minimatch@3 dependency."
